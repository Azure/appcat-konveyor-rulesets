- category: mandatory
  customVariables: []
  description: BeanManager.createInjectionTarget(AnnotatedType) is removed in CDI 4.0
  effort: 2
  labels:
  - source=eap6
  - source=eap7
  - source=eap
  - JakartaEE
  - eap8
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  - capability=jakarta-ee
  links:
  - title: Obtaining an InjectionTarget for a class
    url: https://jakarta.ee/specifications/cdi/3.0/jakarta-cdi-spec-3.0.html#bm_obtain_injectiontarget
  message: BeanManager.createInjectionTarget(AnnotatedType) was deprecated in CDI 3.0 and removed in CDI 4.0. Replace it with BeanManager.getInjectionTargetFactory(AnnotatedType)
    and use the returned factory to create injection targets.
  ruleID: jakarta-cdi-00002
  when:
    java.referenced:
      location: METHOD_CALL
      pattern: jakarta.enterprise.inject.spi.BeanManager.createInjectionTarget
- category: mandatory
  customVariables: []
  description: BeanManager.fireEvent(Object, Annotation...) is removed in CDI 4.0
  effort: 2
  labels:
  - source=eap6
  - source=eap7
  - source=eap
  - JakartaEE
  - eap8
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  - capability=jakarta-ee
  links:
  - title: Firing an event
    url: https://jakarta.ee/specifications/cdi/3.0/jakarta-cdi-spec-3.0.html#bm_fire_event
  message: BeanManager.fireEvent(Object, Annotation...) was deprecated in CDI 3.0 and removed in CDI 4.0. Use BeanManager.getEvent() as the entry point for firing events.
  ruleID: jakarta-cdi-00003
  when:
    java.referenced:
      location: METHOD_CALL
      pattern: jakarta.enterprise.inject.spi.BeanManager.fireEvent
