- category: potential
  customVariables: []
  description: Dynamic loading of agents is planned to be disallowed by default in a future JDK release
  effort: 3
  labels:
  - source=openjdk21-
  - source=openjdk
  - capability=openjdk21+
  - capability=openjdk
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  links:
  - title: 'JEP 451: Prepare to Disallow the Dynamic Loading of Agents'
    url: https://openjdk.org/jeps/451
  - title: 'Issue tracker: Implementation of Prepare to Restrict The Dynamic Loading
      of Agents'
    url: https://bugs.openjdk.org/browse/JDK-8307479
  message: |-
    JDK 21 and later issue a warning when an agent is loaded dynamically. OpenJDK plans to disallow dynamic agent loading by default in a future release.
     Use `-XX:+EnableDynamicAgentLoading` to explicitly allow dynamic loading without warnings. To disallow it explicitly, use `-XX:-EnableDynamicAgentLoading`, which is available in JDK 9 and later. Agents loaded at startup with `-javaagent` or `-agentlib` are unaffected.
  ruleID: java-21-deprecate-dynamic-agents-00000
  when:
    java.referenced:
      location: PACKAGE
      pattern: java.lang.instrument*
