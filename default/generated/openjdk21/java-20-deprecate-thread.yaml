  - capability=openjdk
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  links:
  - title: Thread.stop Changed to Throw UnsupportedOperationException
    url: https://www.oracle.com/java/technologies/javase/20-relnote-issues.html#JDK-8289610
  message: |-
    In JDK 20 through JDK 25, `Thread.stop()` remains present but always throws `UnsupportedOperationException`. It was removed in JDK 26. Replace it with cooperative cancellation, typically by checking a flag or using interruption.
  ruleID: java-20-deprecate-thread-00001
  when:
    or:
    - java.referenced:
        location: METHOD_CALL
        pattern: java.lang.Thread.stop
- category: mandatory
  customVariables: []
  description: ThreadDeath is deprecated for removal
  effort: 3
  labels:
  - source=openjdk20-
  - source=openjdk
  - capability=openjdk20+
  - capability=openjdk
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  links:
  - title: ThreadDeath is deprecated for removal
    url: https://cr.openjdk.org/~iris/se/20/latestSpec/api/deprecated-list.html
  message: |-
    `Thread.stop()` was originally specified to stop a victim thread by causing it to throw a `ThreadDeath`. It was inherently unsafe and deprecated in an early JDK release. In JDK 20, `Thread.stop()` was changed to always throw `UnsupportedOperationException`; it was removed in JDK 26. Consequently, `ThreadDeath` is also deprecated for removal.
  ruleID: java-20-deprecate-thread-00002
  when:
    or:
    - java.referenced:
        location: IMPORT
        pattern: java.lang.ThreadDeath