  description: Thread.suspend/resume Changed to Throw UnsupportedOperationException
  effort: 5
  labels:
  - source=openjdk20-
  - source=openjdk
  - capability=openjdk20+
  - capability=openjdk
  - domain=java-upgrade
  - category=deprecated-apis
  - os=windows
  - os=linux
  - target=azure-appservice
  - target=azure-aks
  - target=azure-container-apps
  links:
  - title: Thread.suspend/resume Changed to Throw UnsupportedOperationException
    url: https://www.oracle.com/java/technologies/javase/20-relnote-issues.html#JDK-8249627
  message: |-
    In JDK 20, `Thread.suspend()` and `Thread.resume()` remain present but always throw `UnsupportedOperationException`. Replace them with application-level coordination and interruption where appropriate.
  ruleID: java-20-deprecate-thread-00000
  when:
    or:
    - java.referenced:
        location: METHOD_CALL
        pattern: java.lang.Thread.suspend
    - java.referenced:
        location: METHOD_CALL
        pattern: java.lang.Thread.resume
- category: mandatory
