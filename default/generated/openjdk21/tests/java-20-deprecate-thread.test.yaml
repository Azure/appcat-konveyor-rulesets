rulesPath: ../java-20-deprecate-thread.yaml
providers:
- name: java
  dataPath: ./data/java-20-deprecate-thread
- name: builtin
  dataPath: ./data/java-20-deprecate-thread
tests:
- ruleID: java-20-deprecate-thread-00000
  testCases:
  - name: tc-1
    hasIncidents:
      exactly: 2
      messageMatches: In JDK 20, `Thread.suspend()` and `Thread.resume()` remain present but always throw `UnsupportedOperationException`.*
- ruleID: java-20-deprecate-thread-00001
  testCases:
  - name: tc-1
    hasIncidents:
      exactly: 1
      messageMatches: In JDK 20 through JDK 25, `Thread.stop()` remains present but always throws `UnsupportedOperationException`.*
- ruleID: java-20-deprecate-thread-00002
  testCases:
  - name: tc-1
    hasIncidents:
      exactly: 1
      messageMatches: \`Thread.stop()` was originally specified to stop a victim thread by causing it to throw a `ThreadDeath`.*