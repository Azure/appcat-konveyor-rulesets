- category: optional
  customVariables: []
  description: Socket communication
  effort: 8
  labels:
  - source=java
  - source=java-ee
  - target=azure-aks
  - target=azure-container-apps
  - target=azure-appservice
  - capability=containerization
  - domain=cloud-readiness
  - category=remote-communication
  - socket
  - containerization
  - os=windows
  - os=linux
  links: []
  message: |-
    Java sockets are internal endpoints of two-way communications. They are defined by an IP address, port, and protocol (TCP/UDP).

    Direct socket communication can complicate cloud deployments when endpoints are fixed, connections are long-lived, or session state is tied to one application instance. Verify service discovery, load balancing, timeouts, retries, and scaling behavior.

    Recommendation: Where direct sockets are unnecessary, prefer loosely coupled protocols or managed messaging services for backing service interactions.
  ruleID: socket-communication-00000
  when:
    or:
    - java.referenced:
        location: IMPORT
        pattern: java.net.(Socket|MulticastSocket|DatagramSocket|InetSocketAddress)*
    - java.referenced:
        location: IMPORT
        pattern: java.net.ServerSocket*
    - java.referenced:
        location: IMPORT
        pattern: java.nio.channels.AsynchronousServerSocketChannel*
    - java.referenced:
        location: IMPORT
        pattern: java.nio.channels.ServerSocketChannel*
- category: optional
  customVariables:
  - name: niochannelclass
    nameOfCaptureGroup: niochannelclass
    pattern: java.nio.channels.(?P<niochannelclass>(NetworkChannel|MulticastChannel|DatagramChannel|AsynchronousSocketChannel|SocketChannel))?.*
  description: Java NIO channel
  effort: 8
  labels:
  - source=java
  - source=java-ee
  - target=azure-aks
  - target=azure-container-apps
  - target=azure-appservice
  - capability=containerization
  - domain=cloud-readiness
  - category=remote-communication
  - socket
  - containerization
  - os=windows
  - os=linux
  links: []
  message: |-
    Java NIO channels provide bulk data transfer to and from NIO buffers. They can be synchronously and asynchronously read and written.

    Network-oriented NIO channels can complicate cloud deployments when endpoints are fixed, connections are long-lived, or session state is tied to one application instance. File-oriented channels are covered separately and do not inherently create this risk.

    Recommendation: Where direct network channels are unnecessary, prefer loosely coupled protocols or managed messaging services for backing service interactions.
  ruleID: socket-communication-00001
  when:
    java.referenced:
      location: IMPORT
      pattern: java.nio.channels.(NetworkChannel|MulticastChannel|DatagramChannel|AsynchronousSocketChannel|SocketChannel)*
