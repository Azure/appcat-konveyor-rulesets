- category: potential
  customVariables: []
  description: HTTP Session data storage
  effort: 5
  labels:
  - source=java
  - source=java-ee
  - target=azure-aks
  - target=azure-container-apps
  - target=azure-appservice
  - domain=cloud-readiness
  - category=session-management
  - clustering
  - os=windows
  - os=linux
  links:
  - title: Azure Cache for Redis Documentation
    url: https://learn.microsoft.com/azure/azure-cache-for-redis
  - title: 'Quickstart: Use Azure Cache for Redis in Java'
    url: https://learn.microsoft.com/azure/azure-cache-for-redis/cache-java-get-started
  message: |-
    When migrating an application that stores data in an HTTP Session to Azure, it's important to consider that the HTTP Session is not a suitable mechanism for maintaining state in a cloud environment due to scaling in and out as load changes.
    Instead, you can use Azure Managed Redis as an external session store.

    * Provide **Azure Managed Redis**: Azure Managed Redis is a fully managed, scalable, distributed caching service. It allows you to store and manage session data in memory, providing fast and efficient access.

    * **Configure Azure Managed Redis**: Configure the cache settings, such as cache size, eviction policies, and access control.

    * **Update session management**: Configure the application to persist HTTP session data in Redis rather than in the memory of a single application instance.

    * **Store and retrieve session data**: Use a supported Redis client or framework integration to store and retrieve session data. This ensures that session state is accessible across multiple instances of your application.

    * **Test and validate**: Test your application to ensure that session state is maintained correctly using Azure Managed Redis. Verify that session data is stored and retrieved accurately across multiple instances of your application.
  ruleID: session-00001
  when:
    or:
    - java.referenced:
        location: METHOD_CALL
        pattern: javax.servlet.http.HttpSession.setAttribute
    - java.referenced:
        location: METHOD_CALL
        pattern: javax.servlet.http.HttpSession.putValue
    - java.referenced:
        location: METHOD_CALL
        pattern: jakarta.servlet.http.HttpSession.setAttribute
    - java.referenced:
        location: METHOD_CALL
        pattern: jakarta.servlet.http.HttpSession.putValue
    - java.referenced:
        location: IMPORT
        pattern: (javax|jakarta).servlet.http.HttpSession
