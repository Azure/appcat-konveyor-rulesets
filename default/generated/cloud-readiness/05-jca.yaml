- category: optional
  customVariables: []
  description: Resource adapter descriptor (ra.xml)
  effort: 5
  labels:
  - source=java
  - source=java-ee
  - target=azure-aks
  - target=azure-container-apps
  - target=azure-appservice
  - domain=cloud-readiness
  - category=java-jca-migration
  - jca
  - os=windows
  - os=linux
  links:
  - title: Azure Service Bus documentation
    url: https://learn.microsoft.com/azure/service-bus-messaging
  - title: Azure Event Hubs documentation
    url: https://learn.microsoft.com/azure/event-hubs/
  message: |-
    The application contains a resource adapter descriptor (`ra.xml`) for a Java Connector Architecture (JCA), now Jakarta Connectors, resource adapter that integrates with an Enterprise Information System (EIS).

    Resource adapters are supported by compatible Jakarta EE runtimes, including runtimes deployed in cloud environments. Migration may require runtime-specific configuration and network access to the external EIS.

    Recommendation: Verify that the target runtime supports the required Jakarta Connectors version, externalize connection and credential settings, and validate EIS connectivity, transaction recovery, security, and scaling behavior.
  ruleID: jca-00000
  when:
    builtin.file:
      pattern: ^ra\.xml$
